image: localhost/jdk17-gradle8

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

before_script:
  # caching rely on this to be defined, otherwise it goes to user home
  - GRADLE_USER_HOME="$(pwd)/.gradle"
  - export GRADLE_USER_HOME
  - export ORACLE_HTTP_PROXY_PORT=www-proxy-hqdc.us.oracle.com
  - export ORACLE_HTTP_PROXY_PORT=80
  - export ORACLE_HTTP_PROXY_NONPROXYHOSTS="artifacthub-phx.oci.oraclecorp.com"
  - export PROXY_OPTS="-Dhttp.proxyHost=$ORACLE_HTTP_PROXY_HOST -Dhttp.proxyPort=$ORACLE_HTTP_PROXY_PORT -Dhttp.nonProxyHosts=$ORACLE_HTTP_PROXY_NONPROXYHOSTS -Dhttps.proxyHost=$ORACLE_HTTP_PROXY_HOST -Dhttps.proxyPort=$ORACLE_HTTP_PROXY_PORT -Dhttps.nonProxyHosts=$ORACLE_HTTP_PROXY_NONPROXYHOSTS"
  - export JAVA_TOOL_OPTIONS="$PROXY_OPTS"

stages:          # List of stages for jobs, and their order of execution
  - build
#  - deploy

variables:
  # speed up checkout of the wls
  GIT_STRATEGY: fetch
  GIT_DEPTH: 10
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

build-job:       # This job runs in the build stage, which runs first.
  stage: build
  script:
    - ./gradlew --build-cache clean build -x buildSearchableOptions -PexcludeTests="**/*DatabaseInterfaceQueueTest*;**/*ObjectPoolBaseTest*"
    - ls -altr build/distributions
  cache:
    key: "$CI_COMMIT_REF_NAME"
    policy: push
    paths:
      - build
      - .gradle
  
