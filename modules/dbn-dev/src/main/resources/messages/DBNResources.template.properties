# CONFIGURATION - cfg.<component>.<element>.<name>
# (text contents in the configuration area of the product)
[CFG_KEYS]


# APPLICATION - app.<component>.<element>.<name>
# (text contents throughout the application)
[APP_KEYS]


# MESSAGES - msg.<component>.<element>.<name>
# (text contents in message dialogs)
[MSG_KEYS]



# NOTIFICATIONS - ntf.<component>.<element>.<name>
# (text contents in event notification area)
[NTF_KEYS]



# PROCESSES - prc.<component>.<element>.<name>
# (text contents in progress dialogs and background tasks)
[PRC_KEYS]


# LOGS - log.<component>.<element>.<name>
# (text contents application consoles - not the app logging itself)
[LOG_KEYS]


# PLUGIN ACTIONS - action.<plugin.xml action id>.text / group.<plugin.xml group id>.text
# These keys use IntelliJ Platform action-bundle naming, not the DBN app.* convention.
# The platform resolves plugin.xml action and group captions directly from their XML ids.
[GROUP_KEYS]



# PLUGIN ACTIONS - action.<plugin.xml action id>.text / group.<plugin.xml group id>.text
# These keys use IntelliJ Platform action-bundle naming, not the DBN app.* convention.
# The platform resolves plugin.xml action and group captions directly from their XML ids.
[ACTION_KEYS]
