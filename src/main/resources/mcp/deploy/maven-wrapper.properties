# Maven Wrapper for the Graal deployment build. "only-script" needs no maven-wrapper.jar:
# the wrapper script downloads the pinned Maven distribution itself inside the build container.
wrapperVersion=3.3.2
distributionType=only-script
distributionUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.9/apache-maven-3.9.9-bin.zip
