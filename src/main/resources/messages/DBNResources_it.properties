app.assistant.hint.AssistantToolCategory_IDE_ACTION_INVOKER=Invocazioni azioni IDE, ad esempio apertura di editor di oggetti database, esecuzione di query e così via.
app.assistant.hint.AssistantToolCategory_METADATA_PROVIDER=Informazioni sulla struttura database
