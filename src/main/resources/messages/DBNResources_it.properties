app.assistant.hint.AssistantTemperaturePreset_BALANCED=Bilancia accuratezza e creatività. Adatto alla maggior parte delle attività, offre un mix di affidabilità e innovazione.
app.assistant.hint.AssistantTemperaturePreset_CUSTOM=Regola manualmente la temperatura per rifinire la generazione delle risposte. Consente un controllo preciso dell'equilibrio tra accuratezza e creatività.
app.assistant.hint.AssistantTemperaturePreset_EXPERIMENTAL=Genera risposte molto innovative e potenzialmente non convenzionali. Ideale per attività che richiedono di spingere i limiti del linguaggio e della creatività.
app.assistant.hint.AssistantTemperaturePreset_EXPLORATORY=Favorisce risposte più creative e varie. Utile per attività che traggono beneficio dall'esplorazione di idee e prospettive diverse.
app.assistant.hint.AssistantTemperaturePreset_PRECISE=Genera risposte con alta accuratezza e creatività minima. Ideale per attività che richiedono informazioni precise e fattuali.
