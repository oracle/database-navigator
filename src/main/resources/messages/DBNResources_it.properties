msg.mcp.text.BuildResultHttp=<html><b>Server MCP creato correttamente.</b><br><br>JAR creato: {0}<br>Configurazione: {1}<br>Wallet: {2}<br>Progetto sorgente: {3}<br><br><b>Passaggi successivi:</b><br>1. Avvia il JAR in modo che serva HTTP (vedi README per transport/httpPort).<br>2. Copia il JSON seguente nella configurazione del client MCP.<br>3. Mantieni privata e sicura la cartella <code>wallet/</code>.<br>4. Vedi <code>README.md</code> nella cartella di output per i dettagli completi di esecuzione e personalizzazione HTTP (incluse le modifiche a <code>httpPort</code>).</html>
msg.mcp.text.BuildResultStdio=<html><b>Server MCP creato correttamente.</b><br><br>JAR creato: {0}<br>Configurazione: {1}<br>Wallet: {2}<br>Progetto sorgente: {3}<br><br><b>Passaggi successivi:</b><br>1. Copia il JSON seguente nella configurazione del client MCP (ad es. Claude Desktop).<br>2. Mantieni privata la cartella <code>wallet/</code>.<br>3. Vedi <code>README.md</code> nella cartella di output per i dettagli completi di esecuzione e personalizzazione.</html>
msg.mcp.text.NamedParametersQuickGuide=<html><b>Usa i placeholder <code>:param</code> nel tuo SQL.</b><ul style="margin-top:4; margin-bottom:4;"><li>Scrivi <code>:param</code> (ad es. <code>WHERE dept_id = :dept</code>).</li><li>Rileviamo i nomi e li elenchiamo nella tabella dei parametri.</li><li>Durante la build diventano JDBC <code>?</code> in ordine da sinistra a destra.</li><li>I nomi ripetuti associano lo <i>stesso</i> valore a ogni occorrenza.</li></ul></html>
