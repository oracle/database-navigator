app.assistant.hint.DatabaseAssistantMode_ANALYTICS=<strong>Analitica</strong><br>Per esplorazione dati e query.<ul><li>Usa metadati di database, schema, tabella e vista per comprendere il modello dati</li><li>Rivede le definizioni delle viste per mostrare come sono costruiti gli strati analitici</li><li>Modella dataset e rifinisce query orientate alla lettura usando editor di dataset e console SQL</li></ul>
app.assistant.hint.DatabaseAssistantMode_DEVELOPMENT=<strong>Sviluppo</strong><br>Per lavoro orientato a database e codice.<ul><li>Usa metadati di database, schema, tabella, vista e programma per esplorare le strutture</li><li>Ispeziona il codice sorgente di viste e programmi per comprendere la logica esistente</li><li>Lavora negli editor di dataset, codice sorgente e console SQL per preparare e rifinire il codice</li></ul>
app.assistant.hint.DatabaseAssistantMode_RAG=<strong>RAG (Retrieval-Augmented Generation)</strong><br>Per risposte basate su ricerca semantica.<ul><li>Fa domande in linguaggio naturale sul contenuto indicizzato</li><li>Recupera e riassume informazioni pertinenti usando la ricerca semantica</li><li>Riceve risposte concise basate sul materiale recuperato</li></ul>
app.assistant.hint.PromptAction_CHAT=Genera una risposta direttamente dall'LLM in base al prompt (potrebbe non conoscere il modello dati se la conversazione del profilo non è abilitata)
app.assistant.hint.PromptAction_EXECUTE_SQL=Genera ed esegue un'istruzione SQL dal prompt in linguaggio naturale, in base al modello dati esposto nel profilo selezionato
app.assistant.hint.PromptAction_EXPLAIN_SQL=Genera un'istruzione SQL con spiegazioni dettagliate dal prompt in linguaggio naturale, in base al modello dati esposto nel profilo selezionato
app.assistant.hint.PromptAction_NARRATE=Genera un'istruzione SQL dal prompt in linguaggio naturale e spiega l'output del comando SQL in linguaggio naturale
app.assistant.hint.PromptAction_SHOW_SQL=Genera un'istruzione SQL dal prompt in linguaggio naturale, in base al modello dati esposto nel profilo selezionato
