cfg.assistant.hint.ApiKeyRequiredToConnect=Per connettersi ai modelli linguistici {0}, inserire di seguito la chiave API personale. È possibile creare e gestire le chiavi nella pagina ufficiale delle chiavi API di {0}.\n\nLa chiave verrà memorizzata in modo sicuro nel gestore password di {1}.
cfg.assistant.hint.OciConfigRequiredToConnect=Per connettersi ai modelli linguistici Oracle OCI Generative AI, fornire di seguito le informazioni di configurazione OCI. Consultare la sezione "Identity" nella Oracle Cloud Console per trovare gli ID utente, tenancy e compartimento, oltre alle istruzioni per scaricare il file della chiave privata o il file di configurazione OCI.
cfg.assistant.hint.ProfileDatasetSelection=I profili AI devono includere informazioni sul modello dati da inoltrare al modello linguistico. Questo consente di produrre risultati più accurati e aderenti al modello dati. I metadati possono includere nomi di tabelle del database, nomi di colonne, tipi di dati delle colonne e commenti. I dati non verranno mai inviati al modello linguistico.\n\nSelezionare i dataset da includere nel profilo e trascinarli nel contenitore a destra. Iniziare selezionando lo schema.
cfg.assistant.hint.ProfileEdit=I profili consentono di personalizzare l'esperienza con l'LLM. È possibile scegliere preset di temperatura diversi per regolare il bilanciamento tra accuratezza e creatività. È anche possibile specificare istruzioni personalizzate per aiutare l'LLM a comprendere meglio le esigenze dell'utente.
