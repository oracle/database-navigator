msg.mcp.hint.ServerDefinition=Il generatore di server MCP consente di definire strumenti MCP basati su SQL per questa connessione database.\n\nOgni strumento espone un'istruzione SQL con nome e parametri tipizzati ai client MCP. Scegli il trasporto STDIO o HTTP e crea un pacchetto server autonomo con JAR eseguibile, configurazione, wallet, progetto sorgente e README.
msg.mcp.hint.ToolDefinition=Il generatore di strumenti MCP trasforma un'istruzione SQL in uno strumento richiamabile per questo server MCP.\n\nAssegna un nome e una descrizione allo strumento in modo che i client MCP possano sceglierlo correttamente. Usa parametri SQL con nome, ad esempio :employee_id; l'elenco parametri viene derivato dall'istruzione e consente di definire tipi, flag obbligatori, descrizioni e valori di test. Esegui Verifica per eseguire la query con valori di esempio prima di salvare.
