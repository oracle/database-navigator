msg.mcp.text.BuildResultHttp=<html><b>MCPサーバーが正常にビルドされました。</b><br><br>ビルド済みJAR: {0}<br>構成: {1}<br>Wallet: {2}<br>ソース・プロジェクト: {3}<br><br><b>次の手順:</b><br>1. JARを起動してHTTPを提供します(transport/httpPortについてはREADMEを参照)。<br>2. 下のJSONをMCPクライアント構成にコピーします。<br>3. <code>wallet/</code>フォルダは非公開かつ安全に保管してください。<br>4. 実行詳細とHTTPカスタマイズ(<code>httpPort</code>の変更を含む)については、出力フォルダ内の<code>README.md</code>を参照してください。</html>
msg.mcp.text.BuildResultStdio=<html><b>MCPサーバーが正常にビルドされました。</b><br><br>ビルド済みJAR: {0}<br>構成: {1}<br>Wallet: {2}<br>ソース・プロジェクト: {3}<br><br><b>次の手順:</b><br>1. 下のJSONをMCPクライアント構成(例: Claude Desktop)にコピーします。<br>2. <code>wallet/</code>フォルダは非公開にしてください。<br>3. 実行とカスタマイズの詳細については、出力フォルダ内の<code>README.md</code>を参照してください。</html>
msg.mcp.text.NamedParametersQuickGuide=<html><b>SQLで<code>:param</code>プレースホルダを使用してください。</b><ul style="margin-top:4; margin-bottom:4;"><li><code>:param</code>を記述します(例: <code>WHERE dept_id = :dept</code>)。</li><li>名前を検出してパラメータ表に一覧表示します。</li><li>ビルド時に左から右の順序でJDBCの<code>?</code>になります。</li><li>繰り返し出現する名前は、各出現箇所に<i>同じ</i>値をバインドします。</li></ul></html>
