app.assistant.hint.DatabaseAssistantMode_ANALYTICS=<strong>分析</strong><br>データ探索および問合せ向け。<ul><li>データベース、スキーマ、テーブル、ビューのメタデータを使用してデータ・モデルを理解します</li><li>ビュー定義を確認し、分析レイヤーがどのように構築されているかを把握します</li><li>データセットおよびSQLコンソール・エディタを使用して、データセットを整え、読取り中心の問合せを洗練します</li></ul>
app.assistant.hint.DatabaseAssistantMode_DEVELOPMENT=<strong>開発</strong><br>データベースおよびコード中心の作業向け。<ul><li>データベース、スキーマ、テーブル、ビュー、プログラムのメタデータを使用して構造を探索します</li><li>ビューおよびプログラムのソース・コードを調べて既存ロジックを理解します</li><li>データセット、ソース・コード、SQLコンソール・エディタでコードを下書きして改良します</li></ul>
app.assistant.hint.DatabaseAssistantMode_RAG=<strong>RAG (Retrieval-Augmented Generation)</strong><br>セマンティック検索ベースの回答向け。<ul><li>索引付けされたコンテンツに自然言語で質問します</li><li>セマンティック検索を使用して関連情報を取得し要約します</li><li>取得した資料に基づく簡潔な回答を受け取ります</li></ul>
app.assistant.hint.PromptAction_CHAT=プロンプトに基づいてLLMから直接応答を生成します(プロファイル会話が有効でない場合、データ・モデルを認識しないことがあります)
app.assistant.hint.PromptAction_EXECUTE_SQL=選択したプロファイルで公開されているデータ・モデルに基づき、自然言語プロンプトからSQL文を生成して実行します
app.assistant.hint.PromptAction_EXPLAIN_SQL=選択したプロファイルで公開されているデータ・モデルに基づき、自然言語プロンプトから詳細な説明付きSQL文を生成します
app.assistant.hint.PromptAction_NARRATE=自然言語プロンプトからSQL文を生成し、SQLコマンドの出力を自然言語で説明します
app.assistant.hint.PromptAction_SHOW_SQL=選択したプロファイルで公開されているデータ・モデルに基づき、自然言語プロンプトからSQL文を生成します
