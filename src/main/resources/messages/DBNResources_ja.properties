msg.mcp.hint.ServerDefinition=MCP server builderは、このデータベース接続用のSQLベースMCPツール定義を支援します。\n\n各ツールは、型付きパラメータを持つ名前付きSQL文をMCPクライアントに公開します。STDIOまたはHTTPトランスポートを選択し、実行可能JAR、構成、Wallet、ソース・プロジェクト、READMEを含むスタンドアロン・サーバー・パッケージをビルドします。
msg.mcp.hint.ToolDefinition=MCP Tool Builderは、SQL文をこのMCPサーバーの呼出し可能ツールに変換します。\n\nMCPクライアントが適切に選択できるよう、ツールに名前と説明を付けてください。:employee_idのような名前付きSQLパラメータを使用します。パラメータ一覧は文から導出され、型、必須フラグ、説明、テスト値を定義できます。保存前にVerifyを実行してサンプル値で問合せを実行してください。
