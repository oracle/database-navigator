app.assistant.hint.AssistantTemperaturePreset_BALANCED=正確性と創造性のバランスを取ります。ほとんどのタスクに適しており、信頼性と新規性を組み合わせます。
app.assistant.hint.AssistantTemperaturePreset_CUSTOM=温度を手動で調整して応答生成を微調整します。正確性と創造性のバランスを細かく制御できます。
app.assistant.hint.AssistantTemperaturePreset_EXPERIMENTAL=非常に革新的で、場合によっては型破りな応答を生成します。言語と創造性の境界を押し広げる必要があるタスクに適しています。
app.assistant.hint.AssistantTemperaturePreset_EXPLORATORY=より創造的で多様な応答を促します。異なるアイデアや観点の探索が役立つタスクに有用です。
app.assistant.hint.AssistantTemperaturePreset_PRECISE=高い正確性と最小限の創造性で応答を生成します。正確で事実に基づく情報が必要なタスクに適しています。
