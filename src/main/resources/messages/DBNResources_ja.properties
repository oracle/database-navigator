cfg.assistant.hint.ApiKeyRequiredToConnect={0}言語モデルに接続するには、個人用APIキーを下に入力してください。キーは公式の{0} APIキー・ページで作成および管理できます。\n\nキーは{1}のパスワード・マネージャに安全に保存されます。
cfg.assistant.hint.OciConfigRequiredToConnect=Oracle OCI Generative AI言語モデルに接続するには、下にOCI構成情報を入力してください。Oracle Cloud Consoleの「Identity」セクションで、ユーザー、テナンシ、コンパートメントID、および秘密キー・ファイルまたはOCI構成ファイルのダウンロード手順を確認できます。
cfg.assistant.hint.ProfileDatasetSelection=AIプロファイルには、言語モデルに渡すデータ・モデルの情報を含める必要があります。これにより、データ・モデルに合わせたより正確な結果を生成できます。メタデータには、データベース表名、列名、列データ型、コメントを含めることができます。データそのものが言語モデルに送信されることはありません。\n\nプロファイルに含めるデータセットを選択し、右側のコンテナにドラッグしてください。まずスキーマを選択します。
cfg.assistant.hint.ProfileEdit=プロファイルを使用すると、LLMでの作業体験をカスタマイズできます。異なる温度プリセットから選択して、正確性と創造性のバランスを調整できます。LLMが要件をよりよく理解できるように、カスタム指示を指定することもできます。
