msg.mcp.text.BuildResultHttp=<html><b>MCP server built successfully.</b><br><br>Built JAR: {0}<br>Config: {1}<br>Wallet: {2}<br>Source project: {3}<br><br><b>Next steps:</b><br>1. Start the JAR so it serves HTTP (see README for transport/httpPort).<br>2. Copy the JSON below into your MCP client configuration.<br>3. Keep the <code>wallet/</code> folder private and secure.<br>4. See <code>README.md</code> in the output folder for full run details and HTTP customization (including <code>httpPort</code> changes).</html>
msg.mcp.text.BuildResultStdio=<html><b>MCP server built successfully.</b><br><br>Built JAR: {0}<br>Config: {1}<br>Wallet: {2}<br>Source project: {3}<br><br><b>Next steps:</b><br>1. Copy the JSON below into your MCP client configuration (e.g. Claude Desktop).<br>2. Keep the <code>wallet/</code> folder private.<br>3. See <code>README.md</code> in the output folder for full run and customization details.</html>
msg.mcp.text.NamedParametersQuickGuide=<html><b>Use <code>:param</code> placeholders in your SQL.</b><ul style="margin-top:4; margin-bottom:4;"><li>Write <code>:param</code> (e.g., <code>WHERE dept_id = :dept</code>).</li><li>We detect names and list them in the parameters table.</li><li>At build time they become JDBC <code>?</code> in left-to-right order.</li><li>Repeated names bind the <i>same</i> value to each occurrence.</li></ul></html>
