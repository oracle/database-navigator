app.assistant.hint.DatabaseAssistantMode_ANALYTICS = <strong>Analytics</strong><br>For data exploration and querying.<ul><li>Use database, schema, table, and view metadata to understand your data model</li><li>Review view definitions to see how analytic layers are built</li><li>Shape datasets and refine read-focused queries using dataset and SQL console editors</li></ul>
app.assistant.hint.DatabaseAssistantMode_DEVELOPMENT = <strong>Development</strong><br>For database and code-focused work.<ul><li>Use database, schema, table, view, and program metadata to explore structures</li><li>Inspect view and program source code to understand existing logic</li><li>Work in dataset, source code, and SQL console editors to draft and refine code</li></ul>
app.assistant.hint.DatabaseAssistantMode_RAG = <strong>RAG (Retrieval-Augmented Generation)</strong><br>For semantic search–based answers.<ul><li>Ask natural language questions over your indexed content</li><li>Retrieve and summarize relevant information using semantic search</li><li>Receive concise answers grounded in the retrieved material</li></ul>
app.assistant.hint.PromptAction_CHAT=Generates a response directly from the LLM based on your prompt (may not be aware of your data model unless profile conversation is enabled).
app.assistant.hint.PromptAction_EXECUTE_SQL=Generates and executes a SQL statement from your natural language prompt, based on the data model exposed in the selected profile.
app.assistant.hint.PromptAction_EXPLAIN_SQL=Generates a SQL statement with detailed explanations from your natural language prompt, based on the data model exposed in the selected profile.
app.assistant.hint.PromptAction_NARRATE=Generates a SQL statement from your natural language prompt and explains the output of the SQL command in your natural language.
app.assistant.hint.PromptAction_SHOW_SQL=Generates a SQL statement from your natural language prompt, based on the data model exposed in the selected profile.
