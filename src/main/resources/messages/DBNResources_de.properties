app.assistant.hint.AssistantTemperaturePreset_BALANCED=Stellt ein Gleichgewicht zwischen Genauigkeit und Kreativität her. Geeignet für die meisten Aufgaben; bietet eine Mischung aus Zuverlässigkeit und Innovation.
app.assistant.hint.AssistantTemperaturePreset_CUSTOM=Temperatur manuell anpassen, um die Antwortgenerierung fein abzustimmen. Ermöglicht genaue Kontrolle über das Verhältnis zwischen Genauigkeit und Kreativität.
app.assistant.hint.AssistantTemperaturePreset_EXPERIMENTAL=Erzeugt sehr innovative und möglicherweise unkonventionelle Antworten. Ideal für Aufgaben, die die Grenzen von Sprache und Kreativität ausreizen.
app.assistant.hint.AssistantTemperaturePreset_EXPLORATORY=Fördert kreativere und vielfältigere Antworten. Nützlich für Aufgaben, bei denen verschiedene Ideen und Perspektiven erkundet werden sollen.
