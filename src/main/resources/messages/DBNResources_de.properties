msg.mcp.hint.ServerDefinition=Der MCP-Server-Builder hilft Ihnen, SQL-gestützte MCP-Tools für diese Datenbankverbindung zu definieren.\n\nJedes Tool stellt MCP-Clients eine benannte SQL-Anweisung mit typisierten Parametern bereit. Wählen Sie STDIO- oder HTTP-Transport und bauen Sie ein eigenständiges Server-Package mit ausführbarem JAR, Konfiguration, Wallet, Quellprojekt und README.
msg.mcp.hint.ToolDefinition=Der MCP-Tool-Builder verwandelt eine SQL-Anweisung in ein aufrufbares Tool für diesen MCP-Server.\n\nBenennen und beschreiben Sie das Tool, damit MCP-Clients es korrekt auswählen können. Verwenden Sie benannte SQL-Parameter wie :employee_id; die Parameterliste wird aus der Anweisung abgeleitet und ermöglicht Ihnen, Typen, Pflichtkennzeichen, Beschreibungen und Testwerte zu definieren. Führen Sie "Prüfen" aus, um die Abfrage vor dem Speichern mit Beispielwerten auszuführen.
