msg.mcp.text.BuildResultHttp=<html><b>MCP-Server erfolgreich gebaut.</b><br><br>Gebautes JAR: {0}<br>Konfiguration: {1}<br>Wallet: {2}<br>Quellprojekt: {3}<br><br><b>Nächste Schritte:</b><br>1. Starten Sie das JAR, damit es HTTP bereitstellt (siehe README für transport/httpPort).<br>2. Kopieren Sie das JSON unten in Ihre MCP-Clientkonfiguration.<br>3. Halten Sie den Ordner <code>wallet/</code> privat und sicher.<br>4. Details zur Ausführung und HTTP-Anpassung (einschließlich Änderungen an <code>httpPort</code>) finden Sie in <code>README.md</code> im Ausgabeordner.</html>
msg.mcp.text.BuildResultStdio=<html><b>MCP-Server erfolgreich gebaut.</b><br><br>Gebautes JAR: {0}<br>Konfiguration: {1}<br>Wallet: {2}<br>Quellprojekt: {3}<br><br><b>Nächste Schritte:</b><br>1. Kopieren Sie das JSON unten in Ihre MCP-Clientkonfiguration (z. B. Claude Desktop).<br>2. Halten Sie den Ordner <code>wallet/</code> privat.<br>3. Details zur Ausführung und Anpassung finden Sie in <code>README.md</code> im Ausgabeordner.</html>
msg.mcp.text.NamedParametersQuickGuide=<html><b>Verwenden Sie <code>:param</code>-Platzhalter in Ihrem SQL.</b><ul style="margin-top:4; margin-bottom:4;"><li>Schreiben Sie <code>:param</code> (z. B. <code>WHERE dept_id = :dept</code>).</li><li>Wir erkennen Namen und listen sie in der Parametertabelle auf.</li><li>Zur Build-Zeit werden sie in Links-nach-rechts-Reihenfolge zu JDBC-<code>?</code>.</li><li>Wiederholte Namen binden bei jedem Vorkommen <i>denselben</i> Wert.</li></ul></html>
