cfg.assistant.hint.ApiKeyRequiredToConnect=Um eine Verbindung zu {0}-Sprachmodellen herzustellen, geben Sie unten Ihren persönlichen API-Schlüssel ein. Sie können Ihre Schlüssel auf der offiziellen {0}-API-Schlüsselseite erstellen und verwalten.\n\nIhr Schlüssel wird sicher im Passwortmanager von {1} gespeichert.
cfg.assistant.hint.OciConfigRequiredToConnect=Um eine Verbindung zu Oracle OCI Generative AI-Sprachmodellen herzustellen, geben Sie unten Ihre OCI-Konfigurationsinformationen ein. Benutzer-, Tenancy- und Compartment-IDs sowie Hinweise zum Herunterladen Ihrer Private-Key-Datei oder der OCI-Konfigurationsdatei finden Sie im Bereich "Identity" der Oracle Cloud Console.
cfg.assistant.hint.ProfileDatasetSelection=AI-Profile müssen Informationen zu Ihrem Datenmodell enthalten, die an das Sprachmodell weitergegeben werden. Dadurch kann es genauere Ergebnisse liefern, die besser auf Ihr Datenmodell zugeschnitten sind. Die Metadaten können Datenbanktabellennamen, Spaltennamen, Spaltendatentypen und Kommentare enthalten. Ihre Daten werden niemals an das Sprachmodell gesendet.\n\nWählen Sie die Datasets aus, die in das Profil aufgenommen werden sollen, und ziehen Sie sie in den Container rechts. Beginnen Sie mit der Auswahl des Schemas.
cfg.assistant.hint.ProfileEdit=Mit Profilen können Sie die Arbeit mit dem LLM anpassen. Sie können verschiedene Temperaturvorgaben wählen, um das Verhältnis zwischen Genauigkeit und Kreativität einzustellen. Außerdem können Sie benutzerdefinierte Anweisungen angeben, damit das LLM Ihre Anforderungen besser versteht.
