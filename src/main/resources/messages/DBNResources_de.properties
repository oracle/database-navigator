app.liquibase.hint.ChangelogTag=Der Changelog-Punkt, bis zu dem Changesets als ausgeführt markiert werden, ohne ihre Datenbankänderungen anzuwenden.
app.liquibase.hint.CheckpointTag=Markiert den aktuellen Zustand der Zieldatenbank vor der Aktualisierung. Verwenden Sie dieses Tag später, um die von der Aktualisierung angewendeten Changesets zurückzusetzen.
app.liquibase.hint.DatabaseChangeLogLockTable=Koordiniert Liquibase-Aktualisierungen, damit immer nur ein Prozess das Schema ändert.
app.liquibase.hint.DatabaseChangeLogTable=Speichert die auf dieses Schema angewendeten Changesets.
app.liquibase.hint.DatabaseTag=Speichert dieses Tag in der Liquibase-Changelog-Historie. Bei generierten Changelogs kennzeichnet es die erstellte Baseline.
app.liquibase.hint.OperationDashboard=Das Liquibase-Operations-Dashboard ist der zentrale Ort für die Arbeit mit Datenbankänderungen. Wählen Sie die gewünschte Verbindung und das gewünschte Schema aus und anschließend eine Operation, z. B. zum Generieren, Validieren, Aktualisieren oder Zurücksetzen eines Changelogs. Vor der Ausführung können Sie die Operation prüfen und konfigurieren.
app.liquibase.hint.Operation_CALCULATE_CHECKSUMS=Die aktuelle Prüfsumme für jedes Changeset im ausgewählten Arbeitsbereich-Changelog berechnen, ohne Datenbank oder Changelog zu ändern.
app.liquibase.hint.Operation_CLEAR_CHECKSUMS=Die gespeicherten Prüfsummen für das ausgewählte Schema löschen. Liquibase berechnet sie beim nächsten Changelog-Lauf neu.
app.liquibase.hint.Operation_COMPARE_SCHEMAS=Vergleichen Sie das ausgewählte Quellschema mit einem Zielschema und beschreiben Sie die Unterschiede, mit denen beide angeglichen werden können. Diese Operation ändert kein Schema.
app.liquibase.hint.Operation_DROP_ALL=Alle Datenbankobjekte löschen, die zum ausgewählten Schema gehören. Dieser Vorgang ist destruktiv und kann nicht rückgängig gemacht werden. Verwenden Sie ihn nur, wenn Sie den Schemainhalt neu erstellen möchten.
app.liquibase.hint.Operation_FUTURE_ROLLBACK=SQL zum Zurücksetzen von Changesets generieren, die noch nicht bereitgestellt wurden. Überprüfen Sie den Rollback-Plan, ohne das ausgewählte Schema zu ändern.
app.liquibase.hint.Operation_GENERATE_CHANGELOG=Erstellen Sie ein Basis-Changelog aus dem ausgewählten Schema. Liquibase liest die Schemaobjekte und speichert ihre aktuelle Struktur im Arbeitsbereich-Changelog, damit spätere Änderungen verfolgt werden können.
app.liquibase.hint.Operation_GENERATE_DATABASE_DOCUMENTATION=Generieren Sie eine HTML-Dokumentationsseite für das ausgewählte Schema und das Workspace-Changelog. Die generierten Dateien werden im Dokumentationsverzeichnis des Workspace gespeichert, ohne die Datenbank zu ändern.
app.liquibase.hint.Operation_GENERATE_DIFF_CHANGELOG=Die ausgewählten Quell- und Zielschemas vergleichen und die erforderlichen Änderungen zum Abgleich des Ziels mit der Quelle in das Workspace-Changelog schreiben. Diese Operation ändert keine Datenbank.
app.liquibase.hint.Operation_LIST_LOCKS=Die aktuell für das ausgewählte Schema gehaltenen Liquibase-Changelog-Sperren auflisten, ohne die Datenbank zu ändern.
app.liquibase.hint.Operation_MARK_NEXT_CHANGESET_RAN=Das nächste ausstehende Changeset im ausgewählten Schema als ausgeführt markieren, ohne seine Änderungen auszuführen.
app.liquibase.hint.Operation_RELEASE_LOCKS=Die Liquibase-Changelog-Sperre für das ausgewählte Schema freigeben. Verwenden Sie dies, wenn ein unterbrochener oder fehlgeschlagener Vorgang das Changelog gesperrt hat.
app.liquibase.hint.Operation_ROLLBACK_CHANGESETS=Machen Sie zuvor angewendete Changesets für das ausgewählte Schema gemäß ihren Rollback-Definitionen rückgängig. Prüfen Sie den Plan vor der Verwendung in gemeinsam genutzten Datenbanken.
app.liquibase.hint.Operation_ROLLBACK_SQL=Generiert SQL für die ausgewählte Rollback-Anweisung, ohne sie auf das Schema anzuwenden. Prüfen Sie damit den Rollback-Plan vor der Ausführung.
app.liquibase.hint.Operation_SHOW_CHANGELOG_HISTORY=Den im ausgewählten Schema aufgezeichneten Liquibase-Verlauf einschließlich Ausführungsreihenfolge, Datum, Tags und Deployment-Informationen prüfen.
app.liquibase.hint.Operation_SHOW_CHANGELOG_STATUS=Prüfen Sie die Changelog-Historie der Datenbank und ermitteln Sie, welche Changesets für das ausgewählte Schema angewendet wurden oder noch ausstehen.
app.liquibase.hint.Operation_SNAPSHOT_DATABASE=Erfasst die aktuelle Struktur des ausgewählten Schemas als Liquibase-Snapshot, ohne die Datenbank zu ändern oder einen Workspace zu benötigen.
app.liquibase.hint.Operation_SYNCHRONIZE_CHANGELOG=Markieren Sie die Workspace-Changesets im ausgewählten Schema als ausgeführt, ohne ihre Änderungen anzuwenden. Verwenden Sie dies, wenn die Datenbank bereits dem Changelog entspricht und in die Liquibase-Verfolgung aufgenommen werden soll.
app.liquibase.hint.Operation_SYNCHRONIZE_CHANGELOG_SQL=SQL generieren, das Workspace-Changesets als ausgeführt markiert, ohne es anzuwenden. Prüfen Sie das SQL, bevor Sie den Changelog synchronisieren.
app.liquibase.hint.Operation_SYNCHRONIZE_CHANGELOG_TO_TAG=Changesets bis zum ausgewählten Changelog-Tag als ausgeführt markieren, ohne ihre Datenbankänderungen anzuwenden. Verwenden Sie dies, um eine Umgebung an einem bekannten Punkt im Changelog zu baselinen.
app.liquibase.hint.Operation_TAG_DATABASE=Erstellt einen benannten Prüfpunkt in der Liquibase-Changelog-Tabelle des ausgewählten Datenbankschemas. Verwenden Sie das Tag später als Rollback-Ziel.
app.liquibase.hint.Operation_UNEXPECTED_CHANGESETS=Im ausgewählten Schema aufgezeichnete Changesets finden, die im aktuellen Workspace-Changelog fehlen. Diese Operation ändert weder Datenbank noch Changelog.
app.liquibase.hint.Operation_UPDATE_DATABASE=Wenden Sie ausstehende Changesets des Arbeitsbereich-Changelogs auf das ausgewählte Schema an. Liquibase kann dabei Tracking-Tabellen erstellen oder aktualisieren.
app.liquibase.hint.Operation_UPDATE_SQL=Generiert SQL für ausstehende Changesets des Workspace, ohne es auf das ausgewählte Schema anzuwenden. Prüfen Sie damit den Aktualisierungsplan vor der Ausführung.
app.liquibase.hint.Operation_UPDATE_TESTING_ROLLBACK=Ausstehende Changesets anwenden, ihre Rollback-Definitionen nacheinander testen und sie erneut anwenden. Diese Operation ändert die ausgewählte Datenbank und sollte nur ausgeführt werden, wenn alle ausstehenden Changesets bereit für die Bereitstellung sind.
app.liquibase.hint.Operation_VALIDATE_CHANGELOG=Prüfen Sie das Arbeitsbereich-Changelog und die referenzierten Ressourcen auf Struktur-, Parsing- und Konfigurationsprobleme, ohne die Datenbank zu ändern.
app.liquibase.hint.RollbackCount=Anzahl der zurückzusetzenden Changesets.
app.liquibase.hint.RollbackDate=Setzt die nach diesem Datum angewendeten Changesets zurück.
app.liquibase.hint.RollbackTag=Setzt alle nach diesem Tag angewendeten Changesets zurück.
app.liquibase.hint.UpdateCount=Anzahl der anzuwendenden ausstehenden Changesets.
app.liquibase.hint.UpdateTag=Changesets bis zu diesem Tag anwenden.
app.liquibase.hint.Workflow_COMPARE_AND_GENERATE=Vergleichen Sie ein Quellschema mit einem Zielschema, prüfen Sie die erkannten Unterschiede und generieren Sie einen Changelog, mit dem das Ziel an die Quelle angeglichen werden kann. Der Vergleich ist schreibgeschützt; prüfen Sie den generierten Changelog vor der Anwendung.
app.liquibase.hint.Workflow_COMPARE_GENERATE_AND_APPLY=Vergleichen Sie ein Quellschema mit einem Zielschema, generieren und validieren Sie einen Diff-Changelog und wenden Sie ihn auf das Zielschema an. Prüfen Sie die generierten Änderungen, bevor der Workflow das Ziel ändert.
app.liquibase.hint.Workflow_DIAGNOSE_DATABASE=Führen Sie eine Prüfung des ausgewählten Schemas durch: Validieren Sie den Changelog, prüfen Sie dessen Status, suchen Sie unerwartete Changesets, kontrollieren Sie Prüfsummen und listen Sie Liquibase-Sperren auf. Dieser Workflow hilft bei der Untersuchung von Tracking- oder Bereitstellungsproblemen.
app.liquibase.hint.Workflow_GENERATE_AND_DOCUMENT=Erfassen Sie das ausgewählte Schema als initialen Changelog, validieren Sie die generierten Dateien und erstellen Sie eine HTML-Datenbankdokumentation. Changelog und Dokumentation werden im ausgewählten Arbeitsbereich abgelegt und können vorhandene generierte Dateien ersetzen.
app.liquibase.hint.Workflow_ROLLBACK_SAFELY=Prüfen Sie die Liquibase-Historie des ausgewählten Schemas, generieren Sie SQL für das Rollback zur Kontrolle und setzen Sie anschließend Changesets gemäß der gewählten Rollback-Anweisung zurück. Prüfen Sie die Vorschau, bevor Sie die Datenbank ändern.
app.liquibase.hint.Workflow_VALIDATE_AND_APPLY=Validieren Sie den Workspace-Changelog, prüfen Sie ausstehende Änderungen und das generierte Update-SQL und wenden Sie das Update auf das ausgewählte Schema an. Liquibase protokolliert die Ausführung in seinen Changelog-Tabellen.
app.liquibase.hint.Workflows=Das Liquibase-Workflow-Dashboard bündelt häufige mehrstufige Aufgaben. Wählen Sie eine Verbindung und ein Schema und anschließend einen Workflow, um Datenbankänderungen nacheinander zu vergleichen, zu generieren, zu validieren, anzuwenden oder zu diagnostizieren.
