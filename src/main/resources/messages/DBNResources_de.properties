app.liquibase.text.OperationDescription_SNAPSHOT_DATABASE=Das aktuelle Datenbankschema als Liquibase-Snapshot erfassen, ohne es zu ändern
app.liquibase.text.OperationDescription_SYNCHRONIZE_CHANGELOG=Die Workspace-Changesets als ausgeführt markieren, ohne ihre Datenbankänderungen anzuwenden.
