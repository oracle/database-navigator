app.liquibase.text.WorkflowDescription_DIAGNOSE_DATABASE=Den Changelog validieren, Status und unerwartete Changesets prüfen, Prüfsummen kontrollieren und Sperren auflisten.
app.liquibase.text.WorkflowDescription_GENERATE_AND_DOCUMENT=Einen initialen Changelog generieren, validieren und eine HTML-Datenbankdokumentation erstellen.
app.liquibase.text.WorkflowDescription_ROLLBACK_SAFELY=Die Changelog-Historie prüfen, Rollback-SQL in der Vorschau anzeigen und ausgewählte Changesets zurücksetzen.
app.liquibase.text.WorkflowDescription_VALIDATE_AND_APPLY=Den Changelog validieren, ausstehende Änderungen prüfen, das generierte SQL in der Vorschau anzeigen und das Update anwenden.
