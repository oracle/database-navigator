app.liquibase.text.OperationDescription_UPDATE_TESTING_ROLLBACK=Ausstehende Changesets anwenden, ihre Rollback-Definitionen testen und sie erneut anwenden.
app.liquibase.text.OperationDescription_VALIDATE_CHANGELOG=Das Liquibase-Changelog validieren und auf strukturelle oder Konfigurationsprobleme prüfen.
