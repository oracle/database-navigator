app.liquibase.text.OperationDescription_CALCULATE_CHECKSUMS=Die aktuelle Prüfsumme für jedes Changeset im Arbeitsbereich-Changelog berechnen.
app.liquibase.text.OperationDescription_CLEAR_CHECKSUMS=Gespeicherte Liquibase-Prüfsummen löschen, damit sie beim nächsten Changelog-Lauf neu berechnet werden.
app.liquibase.text.OperationDescription_COMPARE_SCHEMAS=Ein Quellschema mit einem Zielschema vergleichen und die erforderlichen Änderungen zum Abgleichen generieren.
app.liquibase.text.OperationDescription_DROP_ALL=Alle Datenbankobjekte des ausgewählten Schemas löschen. Dieser Vorgang ist destruktiv und kann nicht rückgängig gemacht werden.
app.liquibase.text.OperationDescription_FUTURE_ROLLBACK=SQL zum Zurücksetzen von Changesets generieren, die noch nicht bereitgestellt wurden.
app.liquibase.text.OperationDescription_GENERATE_CHANGELOG=Ein initiales Liquibase-Changelog aus dem ausgewählten Datenbankschema generieren.
app.liquibase.text.OperationDescription_GENERATE_DATABASE_DOCUMENTATION=HTML-Dokumentation für das ausgewählte Schema und das Workspace-Changelog generieren.
app.liquibase.text.OperationDescription_GENERATE_DIFF_CHANGELOG=Ein Migrations-Changelog aus den Unterschieden zwischen einem Quell- und einem Zielschema generieren.
app.liquibase.text.OperationDescription_LIST_LOCKS=Liquibase-Changelog-Sperren des ausgewählten Datenbankschemas auflisten.
app.liquibase.text.OperationDescription_MARK_NEXT_CHANGESET_RAN=Das nächste ausstehende Liquibase-Changeset als ausgeführt markieren, ohne seine Änderungen anzuwenden.
