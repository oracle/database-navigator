app.assistant.hint.DatabaseAssistantMode_ANALYTICS=<strong>Analytics</strong><br>Für Datenexploration und Abfragen.<ul><li>Metadaten von Datenbank, Schema, Tabelle und View verwenden, um Ihr Datenmodell zu verstehen</li><li>View-Definitionen prüfen, um zu sehen, wie Analyseschichten aufgebaut sind</li><li>Datasets strukturieren und leseorientierte Abfragen mit Dataset- und SQL-Konsoleneditoren verfeinern</li></ul>
