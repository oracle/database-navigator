app.assistant.hint.DatabaseAssistantMode_RAG=<strong>RAG (Retrieval-Augmented Generation)</strong><br>Für Antworten auf Basis semantischer Suche.<ul><li>Natürlichsprachliche Fragen zu Ihren indizierten Inhalten stellen</li><li>Relevante Informationen mit semantischer Suche abrufen und zusammenfassen</li><li>Prägnante Antworten erhalten, die auf dem abgerufenen Material basieren</li></ul>
