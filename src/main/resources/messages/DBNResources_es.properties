msg.mcp.hint.ServerDefinition=El constructor de servidores MCP le ayuda a definir herramientas MCP respaldadas por SQL para esta conexión de base de datos.\n\nCada herramienta expone una sentencia SQL con nombre y parámetros tipados a clientes MCP. Elija transporte STDIO o HTTP y construya un paquete de servidor independiente con un JAR ejecutable, configuración, wallet, proyecto fuente y README.
msg.mcp.hint.ToolDefinition=MCP Tool Builder convierte una sentencia SQL en una herramienta invocable para este servidor MCP.\n\nNombre y describa la herramienta para que los clientes MCP puedan elegirla correctamente. Use parámetros SQL con nombre como :employee_id; la lista de parámetros se deriva de la sentencia y le permite definir tipos, flags obligatorios, descripciones y valores de prueba. Ejecute Verificar para ejecutar la consulta con valores de ejemplo antes de guardar.
