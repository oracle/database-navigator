msg.mcp.text.BuildResultHttp=<html><b>Servidor MCP construido correctamente.</b><br><br>JAR construido: {0}<br>Configuración: {1}<br>Wallet: {2}<br>Proyecto fuente: {3}<br><br><b>Siguientes pasos:</b><br>1. Inicie el JAR para que sirva HTTP (consulte README para transport/httpPort).<br>2. Copie el JSON siguiente en la configuración de su cliente MCP.<br>3. Mantenga la carpeta <code>wallet/</code> privada y segura.<br>4. Consulte <code>README.md</code> en la carpeta de salida para detalles completos de ejecución y personalización HTTP (incluidos cambios de <code>httpPort</code>).</html>
msg.mcp.text.BuildResultStdio=<html><b>Servidor MCP construido correctamente.</b><br><br>JAR construido: {0}<br>Configuración: {1}<br>Wallet: {2}<br>Proyecto fuente: {3}<br><br><b>Siguientes pasos:</b><br>1. Copie el JSON siguiente en la configuración de su cliente MCP (p. ej., Claude Desktop).<br>2. Mantenga privada la carpeta <code>wallet/</code>.<br>3. Consulte <code>README.md</code> en la carpeta de salida para detalles completos de ejecución y personalización.</html>
msg.mcp.text.NamedParametersQuickGuide=<html><b>Use marcadores <code>:param</code> en su SQL.</b><ul style="margin-top:4; margin-bottom:4;"><li>Escriba <code>:param</code> (p. ej., <code>WHERE dept_id = :dept</code>).</li><li>Detectamos los nombres y los listamos en la tabla de parámetros.</li><li>En tiempo de build se convierten en <code>?</code> JDBC en orden de izquierda a derecha.</li><li>Los nombres repetidos enlazan el <i>mismo</i> valor en cada aparición.</li></ul></html>
