cfg.assistant.hint.ApiKeyRequiredToConnect=Para conectarse con los modelos de lenguaje de {0}, introduzca abajo su clave API personal. Puede crear y gestionar sus claves en la página oficial de claves API de {0}.\n\nLa clave se almacenará de forma segura en el gestor de contraseñas de {1}.
cfg.assistant.hint.OciConfigRequiredToConnect=Para conectarse con los modelos de lenguaje de Oracle OCI Generative AI, proporcione abajo la información de configuración de OCI. Visite la sección "Identity" de Oracle Cloud Console para encontrar los ID de usuario, tenancy y compartimento, así como las instrucciones para descargar el archivo de clave privada o el archivo de configuración OCI.
cfg.assistant.hint.ProfileDatasetSelection=Los perfiles de IA deben incluir información sobre su modelo de datos para enviarla al modelo de lenguaje. Esto le permitirá producir resultados más precisos y ajustados a su modelo de datos. Los metadatos pueden incluir nombres de tablas de base de datos, nombres de columnas, tipos de datos de columna y comentarios. Sus datos nunca se enviarán al modelo de lenguaje.\n\nSeleccione los conjuntos de datos que se incluirán en el perfil y arrástrelos al contenedor de la derecha. Empiece seleccionando el esquema.
cfg.assistant.hint.ProfileEdit=Los perfiles le permiten personalizar su experiencia con el LLM. Puede elegir entre distintos preajustes de temperatura para ajustar el equilibrio entre precisión y creatividad. También puede especificar instrucciones personalizadas para ayudar al LLM a comprender mejor sus necesidades.
