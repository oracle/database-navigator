msg.mcp.hint.ServerDefinition=O construtor de servidor MCP ajuda você a definir ferramentas MCP baseadas em SQL para esta conexão de banco de dados.\n\nCada ferramenta expõe uma instrução SQL nomeada com parâmetros tipados para clientes MCP. Escolha transporte STDIO ou HTTP e construa um pacote de servidor independente com um JAR executável, configuração, wallet, projeto-fonte e README.
msg.mcp.hint.ToolDefinition=O MCP Tool Builder transforma uma instrução SQL em uma ferramenta chamável para este servidor MCP.\n\nNomeie e descreva a ferramenta para que clientes MCP possam escolhê-la corretamente. Use parâmetros SQL nomeados, como :employee_id; a lista de parâmetros é derivada da instrução e permite definir tipos, flags obrigatórios, descrições e valores de teste. Execute Verificar para executar a consulta com valores de amostra antes de salvar.
