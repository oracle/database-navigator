cfg.assistant.hint.ApiKeyRequiredToConnect=Para conectar aos modelos de linguagem {0}, informe sua chave de API pessoal abaixo. Você pode criar e gerenciar suas chaves na página oficial de chaves de API de {0}.\n\nSua chave será armazenada com segurança no gerenciador de senhas de {1}.
cfg.assistant.hint.OciConfigRequiredToConnect=Para conectar aos modelos de linguagem Oracle OCI Generative AI, forneça suas informações de configuração OCI abaixo. Acesse a seção "Identity" no Oracle Cloud Console para encontrar seus IDs de usuário, tenancy e compartimento, bem como instruções para baixar seu arquivo de chave privada ou o arquivo de configuração OCI.
cfg.assistant.hint.ProfileDatasetSelection=Os perfis de IA devem incluir informações sobre seu modelo de dados para serem encaminhadas ao modelo de linguagem. Isso permitirá que ele produza resultados mais precisos, bem ajustados ao seu modelo de dados. Os metadados podem incluir nomes de tabelas de banco de dados, nomes de colunas, tipos de dados de colunas e comentários. Seus dados nunca serão enviados ao modelo de linguagem.\n\nSelecione os conjuntos de dados a incluir no perfil e arraste-os para o contêiner à direita. Comece selecionando o esquema.
cfg.assistant.hint.ProfileEdit=Os perfis permitem personalizar sua experiência com o LLM. Você pode escolher entre diferentes predefinições de temperatura para ajustar o equilíbrio entre precisão e criatividade. Também pode especificar instruções personalizadas para ajudar o LLM a entender melhor suas necessidades.
