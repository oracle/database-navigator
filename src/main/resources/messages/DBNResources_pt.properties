app.assistant.hint.DatabaseAssistantMode_ANALYTICS=<strong>Analytics</strong><br>Para exploração e consulta de dados.<ul><li>Use metadados de banco de dados, esquema, tabela e view para entender seu modelo de dados</li><li>Revise definições de view para ver como as camadas analíticas são construídas</li><li>Modele conjuntos de dados e refine consultas focadas em leitura usando editores de conjunto de dados e console SQL</li></ul>
app.assistant.hint.DatabaseAssistantMode_DEVELOPMENT=<strong>Desenvolvimento</strong><br>Para trabalho focado em banco de dados e código.<ul><li>Use metadados de banco de dados, esquema, tabela, view e programa para explorar estruturas</li><li>Inspecione código-fonte de views e programas para entender a lógica existente</li><li>Trabalhe em editores de conjunto de dados, código-fonte e console SQL para rascunhar e refinar código</li></ul>
app.assistant.hint.DatabaseAssistantMode_RAG=<strong>RAG (Retrieval-Augmented Generation)</strong><br>Para respostas baseadas em busca semântica.<ul><li>Faça perguntas em linguagem natural sobre seu conteúdo indexado</li><li>Recupere e resuma informações relevantes usando busca semântica</li><li>Receba respostas concisas fundamentadas no material recuperado</li></ul>
app.assistant.hint.PromptAction_CHAT=Gera uma resposta diretamente do LLM com base no seu prompt (pode não conhecer seu modelo de dados, a menos que a conversa do perfil esteja ativada)
app.assistant.hint.PromptAction_EXECUTE_SQL=Gera e executa uma instrução SQL a partir do seu prompt em linguagem natural, com base no modelo de dados exposto no perfil selecionado
