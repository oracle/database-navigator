app.assistant.hint.AssistantTemperaturePreset_BALANCED=Equilibra precisão e criatividade. Adequado para a maioria das tarefas, fornecendo uma combinação de confiabilidade e inovação.
app.assistant.hint.AssistantTemperaturePreset_CUSTOM=Ajuste manualmente a temperatura para refinar a geração da resposta. Permite controle preciso sobre o equilíbrio entre precisão e criatividade.
app.assistant.hint.AssistantTemperaturePreset_EXPERIMENTAL=Gera respostas altamente inovadoras e potencialmente não convencionais. Ideal para tarefas que exigem ultrapassar os limites da linguagem e da criatividade.
app.assistant.hint.AssistantTemperaturePreset_EXPLORATORY=Estimula respostas mais criativas e diversas. Útil para tarefas que se beneficiam da exploração de diferentes ideias e perspectivas.
app.assistant.hint.AssistantTemperaturePreset_PRECISE=Gera respostas com alta precisão e criatividade mínima. Ideal para tarefas que exigem informações precisas e factuais.
app.assistant.hint.AssistantToolCategory_ACTION_INVOKER=Operações de banco de dados e invocações de ações externas
app.assistant.hint.AssistantToolCategory_CONFIG_INFO_PROVIDER=Detalhes de configuração do banco de dados
app.assistant.hint.AssistantToolCategory_DATA_PROVIDER=Registros de dados reais e resultados de consultas
app.assistant.hint.AssistantToolCategory_EXTERNAL=Ferramenta externa fornecida por servidores MCP
app.assistant.hint.AssistantToolCategory_IDE_ACTION_INVOKER=Invocações de ações da IDE, como abrir editores de objetos de banco de dados, executar consultas etc.
app.assistant.hint.AssistantToolCategory_METADATA_PROVIDER=Insights sobre a estrutura do banco de dados
app.assistant.hint.AssistantToolCategory_SOURCE_CODE_PROVIDER=Código-fonte para objetos de banco de dados
app.assistant.hint.AssistantToolCategory_USER_INTERACTION=Ferramentas interativas para entrada rápida do usuário
