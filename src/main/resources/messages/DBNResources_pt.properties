msg.mcp.text.BuildResultHttp=<html><b>Servidor MCP construído com sucesso.</b><br><br>JAR construído: {0}<br>Configuração: {1}<br>Wallet: {2}<br>Projeto-fonte: {3}<br><br><b>Próximas etapas:</b><br>1. Inicie o JAR para que ele sirva HTTP (consulte README para transport/httpPort).<br>2. Copie o JSON abaixo para a configuração do seu cliente MCP.<br>3. Mantenha a pasta <code>wallet/</code> privada e segura.<br>4. Consulte <code>README.md</code> na pasta de saída para detalhes completos de execução e personalização HTTP (incluindo alterações de <code>httpPort</code>).</html>
msg.mcp.text.BuildResultStdio=<html><b>Servidor MCP construído com sucesso.</b><br><br>JAR construído: {0}<br>Configuração: {1}<br>Wallet: {2}<br>Projeto-fonte: {3}<br><br><b>Próximas etapas:</b><br>1. Copie o JSON abaixo para a configuração do seu cliente MCP (ex.: Claude Desktop).<br>2. Mantenha a pasta <code>wallet/</code> privada.<br>3. Consulte <code>README.md</code> na pasta de saída para detalhes completos de execução e personalização.</html>
msg.mcp.text.NamedParametersQuickGuide=<html><b>Use placeholders <code>:param</code> no seu SQL.</b><ul style="margin-top:4; margin-bottom:4;"><li>Escreva <code>:param</code> (ex.: <code>WHERE dept_id = :dept</code>).</li><li>Detectamos nomes e os listamos na tabela de parâmetros.</li><li>Em tempo de build, eles se tornam JDBC <code>?</code> em ordem da esquerda para a direita.</li><li>Nomes repetidos vinculam o <i>mesmo</i> valor a cada ocorrência.</li></ul></html>
