app.liquibase.hint.Workflow_COMPARE_AND_GENERATE=소스 스키마와 대상 스키마를 비교하고 감지된 차이를 검토한 후 대상을 소스에 맞추는 데 사용할 수 있는 changelog를 생성합니다. 비교는 읽기 전용이며, 적용하기 전에 생성된 changelog를 검토해야 합니다.
app.liquibase.hint.Workflow_COMPARE_GENERATE_AND_APPLY=소스 스키마와 대상 스키마를 비교하고 차이 changelog를 생성 및 검증한 후 대상 스키마에 적용합니다. 대상을 변경하기 전에 생성된 변경 사항을 검토하십시오.
app.liquibase.hint.Workflow_DIAGNOSE_DATABASE=changelog를 검증하고 상태를 확인하며 예기치 않은 changeset을 찾고 체크섬을 검사하고 Liquibase 잠금을 나열하여 선택한 스키마를 진단합니다. 추적 또는 배포 문제를 조사할 때 사용하는 워크플로입니다.
app.liquibase.hint.Workflow_GENERATE_AND_DOCUMENT=선택한 스키마에서 초기 changelog를 생성하고 생성된 파일을 검증한 후 데이터베이스 HTML 문서를 만듭니다. changelog와 문서는 선택한 워크스페이스에 기록되며 기존 생성 파일을 대체할 수 있습니다.
app.liquibase.hint.Workflow_ROLLBACK_SAFELY=선택한 스키마의 Liquibase 기록을 검토하고 확인을 위한 rollback SQL을 생성한 다음 선택한 rollback 지침에 따라 changeset을 롤백합니다. 데이터베이스를 변경하기 전에 미리 보기를 확인하십시오.
app.liquibase.hint.Workflow_VALIDATE_AND_APPLY=워크스페이스 changelog를 검증하고 보류 중인 변경 사항과 생성된 업데이트 SQL을 검토한 후 선택한 스키마에 업데이트를 적용합니다. Liquibase는 실행 기록을 changelog 테이블에 저장합니다.
