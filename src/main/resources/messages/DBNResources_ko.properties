cfg.assistant.hint.OciConfigRequiredToConnect=Oracle OCI Generative AI 언어 모델에 연결하려면 아래에 OCI 구성 정보를 입력하세요. Oracle Cloud Console의 "Identity" 섹션에서 사용자, 테넌시 및 구획 ID와 개인 키 파일 또는 OCI 구성 파일 다운로드 지침을 확인할 수 있습니다.
cfg.assistant.hint.ProfileDatasetSelection=AI 프로파일에는 언어 모델로 전달할 데이터 모델 정보가 포함되어야 합니다. 이를 통해 데이터 모델에 더 잘 맞는 정확한 결과를 생성할 수 있습니다. 메타데이터에는 데이터베이스 테이블 이름, 열 이름, 열 데이터 유형 및 주석이 포함될 수 있습니다. 데이터 자체는 언어 모델로 전송되지 않습니다.\n\n프로파일에 포함할 데이터셋을 선택하고 오른쪽 컨테이너로 끌어 놓으세요. 먼저 스키마를 선택하세요.
cfg.assistant.hint.ProfileEdit=프로파일을 사용하면 LLM 사용 환경을 사용자화할 수 있습니다. 다양한 온도 사전 설정 중에서 선택하여 정확성과 창의성의 균형을 조정할 수 있습니다. LLM이 요구 사항을 더 잘 이해하도록 사용자 지정 지침을 지정할 수도 있습니다.
