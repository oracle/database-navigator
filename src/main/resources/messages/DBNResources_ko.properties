app.assistant.hint.AssistantTemperaturePreset_BALANCED=정확성과 창의성 사이의 균형을 맞춥니다. 대부분의 작업에 적합하며 신뢰성과 혁신성을 함께 제공합니다.
app.assistant.hint.AssistantTemperaturePreset_CUSTOM=응답 생성을 세밀하게 조정하도록 온도를 수동으로 조절합니다. 정확성과 창의성 사이의 균형을 정밀하게 제어할 수 있습니다.
app.assistant.hint.AssistantTemperaturePreset_EXPERIMENTAL=매우 혁신적이고 관습적이지 않을 수 있는 응답을 생성합니다. 언어와 창의성의 한계를 넓혀야 하는 작업에 적합합니다.
app.assistant.hint.AssistantTemperaturePreset_EXPLORATORY=더 창의적이고 다양한 응답을 권장합니다. 여러 아이디어와 관점을 탐색하면 도움이 되는 작업에 유용합니다.
app.assistant.hint.AssistantTemperaturePreset_PRECISE=높은 정확도와 최소한의 창의성으로 응답을 생성합니다. 정확하고 사실적인 정보가 필요한 작업에 적합합니다.
