app.liquibase.text.OperationDescription_CLEAR_CHECKSUMS=저장된 Liquibase 체크섬을 지워 다음 changelog 실행 시 다시 계산하도록 합니다.
app.liquibase.text.OperationDescription_CALCULATE_CHECKSUMS=워크스페이스 changelog의 각 변경 세트에 대한 현재 체크섬을 계산합니다.
app.liquibase.text.OperationDescription_COMPARE_SCHEMAS=소스 스키마와 대상 스키마를 비교하고 일치시키는 데 필요한 변경 사항을 생성합니다.
app.liquibase.text.OperationDescription_DROP_ALL=선택한 스키마가 소유한 모든 데이터베이스 객체를 삭제합니다. 이 작업은 파괴적이며 실행 취소할 수 없습니다.
app.liquibase.text.OperationDescription_FUTURE_ROLLBACK=아직 배포되지 않은 변경 세트를 롤백하는 SQL을 생성합니다.
app.liquibase.text.OperationDescription_GENERATE_CHANGELOG=선택한 데이터베이스 스키마에서 초기 Liquibase changelog를 생성합니다.
app.liquibase.text.OperationDescription_GENERATE_DATABASE_DOCUMENTATION=선택한 스키마와 워크스페이스 changelog에 대한 HTML 문서를 생성합니다.
app.liquibase.text.OperationDescription_GENERATE_DIFF_CHANGELOG=소스 스키마와 대상 스키마의 차이에서 마이그레이션 changelog를 생성합니다.
app.liquibase.text.OperationDescription_MARK_NEXT_CHANGESET_RAN=보류 중인 다음 Liquibase 변경 세트를 변경 사항을 적용하지 않고 실행됨으로 표시합니다.
app.liquibase.text.OperationDescription_RELEASE_LOCKS=선택한 데이터베이스 스키마가 보유한 Liquibase changelog 잠금을 해제합니다.
app.liquibase.text.OperationDescription_LIST_LOCKS=선택한 스키마가 보유한 Liquibase changelog 잠금을 나열합니다.
app.liquibase.text.OperationDescription_ROLLBACK_CHANGESETS=이전에 적용된 Liquibase changeset을 롤백합니다.
app.liquibase.text.OperationDescription_ROLLBACK_SQL=선택한 롤백 작업을 적용하지 않고 롤백 SQL을 생성합니다.
app.liquibase.text.OperationDescription_SHOW_CHANGELOG_HISTORY=데이터베이스 Liquibase 기록에 저장된 변경 집합을 표시합니다.
app.liquibase.text.OperationDescription_UNEXPECTED_CHANGESETS=데이터베이스에 기록되어 있지만 워크스페이스 changelog에 없는 변경 세트를 찾습니다.
app.liquibase.text.OperationDescription_SHOW_CHANGELOG_STATUS=데이터베이스에 적용된 changeset과 아직 보류 중인 changeset을 표시합니다.
app.liquibase.text.OperationDescription_SNAPSHOT_DATABASE=현재 데이터베이스 스키마를 변경하지 않고 Liquibase 스냅샷으로 캡처합니다
app.liquibase.text.OperationDescription_SYNCHRONIZE_CHANGELOG=데이터베이스 변경 사항을 적용하지 않고 워크스페이스 changeset을 실행된 것으로 표시합니다.
app.liquibase.text.OperationDescription_SYNCHRONIZE_CHANGELOG_TO_TAG=선택한 태그까지의 변경 세트를 데이터베이스 변경 없이 실행된 것으로 기록합니다.
app.liquibase.text.OperationDescription_SYNCHRONIZE_CHANGELOG_SQL=데이터베이스에 적용하지 않고 워크스페이스 changeset을 실행된 것으로 표시하는 SQL을 생성합니다.
app.liquibase.text.OperationDescription_TAG_DATABASE=선택한 데이터베이스 스키마에 이름이 지정된 Liquibase 태그를 생성합니다.
app.liquibase.text.OperationDescription_UPDATE_DATABASE=보류 중인 Liquibase changeset을 데이터베이스에 적용합니다.
app.liquibase.text.OperationDescription_UPDATE_TESTING_ROLLBACK=보류 중인 변경 세트를 적용하고 롤백을 테스트한 후 다시 적용합니다.
app.liquibase.text.OperationDescription_UPDATE_SQL=보류 중인 변경 집합을 적용하지 않고 업데이트 SQL을 생성합니다.
app.liquibase.text.OperationDescription_VALIDATE_CHANGELOG=Liquibase changelog를 검증하고 구조 또는 구성 문제를 확인합니다.
app.liquibase.text.WorkflowDescription_COMPARE_AND_GENERATE=소스 및 대상 스키마를 비교하고 차이점을 검토한 후 차이 changelog를 생성합니다.
app.liquibase.text.WorkflowDescription_COMPARE_GENERATE_AND_APPLY=소스 및 대상 스키마를 비교하고 차이 changelog를 생성 및 검증한 후 대상 스키마에 적용합니다.
app.liquibase.text.WorkflowDescription_DIAGNOSE_DATABASE=changelog의 유효성을 검사하고 상태 및 예기치 않은 changeset을 확인하며 체크섬을 검사하고 잠금을 나열합니다.
app.liquibase.text.WorkflowDescription_GENERATE_AND_DOCUMENT=초기 changelog를 생성하고 유효성을 검사한 후 데이터베이스 HTML 문서를 생성합니다.
app.liquibase.text.WorkflowDescription_ROLLBACK_SAFELY=changelog 기록을 검토하고 rollback SQL을 미리 본 후 선택한 changeset을 롤백합니다.
app.liquibase.text.WorkflowDescription_VALIDATE_AND_APPLY=changelog의 유효성을 검사하고 보류 중인 변경 사항을 검토하며 생성된 SQL을 미리 본 후 업데이트를 적용합니다.
