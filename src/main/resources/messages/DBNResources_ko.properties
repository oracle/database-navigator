app.liquibase.hint.ChangelogTag=데이터베이스 변경 없이 변경 세트를 실행된 것으로 기록할 changelog 지점입니다.
app.liquibase.hint.CheckpointTag=업데이트 전에 대상 데이터베이스의 현재 상태를 표시합니다. 나중에 이 태그를 사용하여 업데이트에서 적용한 changeset을 롤백할 수 있습니다.
app.liquibase.hint.DatabaseChangeLogLockTable=Liquibase 업데이트를 조정하여 한 번에 하나의 프로세스만 스키마를 변경하도록 합니다.
app.liquibase.hint.DatabaseChangeLogTable=이 스키마에 적용된 changeset을 저장합니다.
app.liquibase.hint.DatabaseTag=이 태그를 Liquibase changelog 기록에 저장합니다. 생성된 changelog에서는 생성된 기준선을 식별합니다.
app.liquibase.hint.Operation_CALCULATE_CHECKSUMS=선택한 워크스페이스 changelog의 각 변경 세트에 대한 현재 체크섬을 데이터베이스나 changelog를 수정하지 않고 계산합니다.
app.liquibase.hint.Operation_CLEAR_CHECKSUMS=선택한 스키마의 저장된 체크섬을 지웁니다. Liquibase는 다음 changelog 처리 시 체크섬을 다시 계산합니다.
app.liquibase.hint.Operation_COMPARE_SCHEMAS=선택한 소스 스키마와 대상 스키마를 비교하고 두 스키마를 일치시키는 데 사용할 수 있는 차이점을 표시합니다. 이 작업은 어느 스키마도 변경하지 않습니다.
app.liquibase.hint.Operation_DROP_ALL=선택한 스키마가 소유한 모든 데이터베이스 객체를 삭제합니다. 이 작업은 파괴적이며 실행을 취소할 수 없습니다. 스키마 내용을 다시 생성하려는 경우에만 사용하십시오.
app.liquibase.hint.Operation_FUTURE_ROLLBACK=아직 배포되지 않은 변경 세트를 롤백하는 SQL을 생성합니다. 선택한 스키마를 수정하지 않고 롤백 계획을 검토할 수 있습니다.
app.liquibase.hint.Operation_GENERATE_CHANGELOG=선택한 스키마에서 기준 changelog를 생성합니다. Liquibase는 스키마 객체를 읽고 현재 구조를 워크스페이스 changelog에 기록하여 이후 변경 사항을 추적할 수 있도록 합니다.
app.liquibase.hint.Operation_GENERATE_DATABASE_DOCUMENTATION=선택한 스키마와 워크스페이스 changelog에 대한 HTML 문서 사이트를 생성합니다. 데이터베이스를 변경하지 않고 생성된 파일을 워크스페이스 문서 디렉터리에 기록합니다.
app.liquibase.hint.Operation_GENERATE_DIFF_CHANGELOG=선택한 소스 스키마와 대상 스키마를 비교하고 대상을 소스에 맞추는 데 필요한 변경 사항을 워크스페이스 changelog에 기록합니다. 이 작업은 데이터베이스를 변경하지 않습니다.
app.liquibase.hint.Operation_LIST_LOCKS=선택한 스키마가 보유한 Liquibase changelog 잠금을 데이터베이스를 수정하지 않고 나열합니다.
app.liquibase.hint.Operation_MARK_NEXT_CHANGESET_RAN=선택한 스키마에서 보류 중인 다음 변경 세트를 변경 사항을 실행하지 않고 실행됨으로 표시합니다.
app.liquibase.hint.Operation_RELEASE_LOCKS=선택한 스키마의 Liquibase changelog 잠금을 해제합니다. 중단되거나 실패한 작업으로 changelog가 잠긴 경우 사용하십시오.
app.liquibase.hint.Operation_ROLLBACK_CHANGESETS=롤백 정의에 따라 선택한 스키마에 이전에 적용된 changeset을 되돌립니다. 공유 데이터베이스에서 사용하기 전에 계획을 검토하십시오.
app.liquibase.hint.Operation_ROLLBACK_SQL=스키마에 적용하지 않고 선택한 롤백 명령에 대한 SQL을 생성합니다. 실행 전에 롤백 계획을 검토할 수 있습니다.
app.liquibase.hint.Operation_SHOW_CHANGELOG_HISTORY=선택한 스키마의 Liquibase 기록에 저장된 변경 집합을 확인합니다. 실행 순서, 날짜, 태그 및 배포 정보를 확인할 수 있습니다.
app.liquibase.hint.Operation_SHOW_CHANGELOG_STATUS=데이터베이스 changelog 기록을 확인하고 선택한 스키마에서 이미 적용되었거나 아직 보류 중인 changeset을 식별합니다.
app.liquibase.hint.Operation_SNAPSHOT_DATABASE=선택한 스키마의 현재 구조를 데이터베이스를 변경하거나 작업 공간을 요구하지 않고 Liquibase 스냅샷으로 캡처합니다.
app.liquibase.hint.Operation_SYNCHRONIZE_CHANGELOG=변경 사항을 적용하지 않고 선택한 스키마에서 워크스페이스 changeset을 실행된 것으로 표시합니다. 데이터베이스가 이미 changelog와 일치하며 Liquibase 추적에 포함해야 할 때 사용합니다.
app.liquibase.hint.Operation_SYNCHRONIZE_CHANGELOG_SQL=적용하지 않고 워크스페이스 changeset을 실행된 것으로 표시하는 SQL을 생성합니다. changelog를 동기화하기 전에 SQL을 검토하십시오.
app.liquibase.hint.Operation_SYNCHRONIZE_CHANGELOG_TO_TAG=선택한 changelog 태그까지의 변경 세트를 데이터베이스 변경 없이 실행된 것으로 기록합니다. 알려진 changelog 지점을 기준으로 환경을 설정할 때 사용합니다.
app.liquibase.hint.Operation_TAG_DATABASE=선택한 스키마의 Liquibase changelog 테이블에 이름이 지정된 체크포인트를 생성합니다. 나중에 이 태그를 롤백 대상으로 사용할 수 있습니다.
app.liquibase.hint.Operation_UNEXPECTED_CHANGESETS=선택한 스키마에 기록되어 있지만 현재 워크스페이스 changelog에 없는 변경 세트를 찾습니다. 이 작업은 데이터베이스나 changelog를 수정하지 않습니다.
app.liquibase.hint.Operation_UPDATE_DATABASE=워크스페이스 changelog의 보류 중인 changeset을 선택한 스키마에 적용합니다. 작업 중 Liquibase 추적 테이블이 생성되거나 업데이트될 수 있습니다.
app.liquibase.hint.Operation_UPDATE_SQL=선택한 스키마에 적용하지 않고 작업 공간의 보류 중인 변경 집합에 대한 SQL을 생성합니다. 실행 전에 업데이트 계획을 검토할 수 있습니다.
app.liquibase.hint.Operation_UPDATE_TESTING_ROLLBACK=보류 중인 변경 세트를 적용하고 롤백 정의를 순서대로 테스트한 후 다시 적용합니다. 이 작업은 선택한 데이터베이스를 변경하므로 모든 보류 중인 변경 세트가 배포 준비된 경우에만 사용해야 합니다.
app.liquibase.hint.Operation_VALIDATE_CHANGELOG=데이터베이스를 변경하지 않고 워크스페이스 changelog와 참조 리소스의 구조, 구문 분석 및 구성 문제를 확인합니다.
app.liquibase.hint.OperationDashboard=Liquibase 작업 대시보드는 데이터베이스 변경 작업을 위한 중앙 화면입니다. 작업할 연결과 스키마를 선택한 다음 changelog 생성, 검증, 업데이트 또는 롤백과 같은 작업을 선택하십시오. 실행 전에 작업을 검토하고 구성할 수 있습니다.
app.liquibase.hint.Workflows=Liquibase 워크플로 대시보드는 일반적인 여러 단계 작업을 모아 제공합니다. 연결과 스키마를 선택한 다음 데이터베이스 변경을 순서대로 비교, 생성, 검증, 적용 또는 진단할 워크플로를 선택하십시오.
app.liquibase.hint.RollbackCount=롤백할 변경 집합의 개수입니다.
app.liquibase.hint.RollbackDate=이 날짜 이후에 적용된 변경 집합을 롤백합니다.
app.liquibase.hint.RollbackTag=이 태그 이후에 적용된 모든 변경 집합을 롤백합니다.
app.liquibase.hint.UpdateCount=적용할 보류 중인 변경 세트 수입니다.
app.liquibase.hint.UpdateTag=이 태그까지 변경 세트를 적용합니다.
