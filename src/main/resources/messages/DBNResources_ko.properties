app.assistant.hint.DatabaseAssistantMode_ANALYTICS=<strong>분석</strong><br>데이터 탐색 및 질의를 위한 모드입니다.<ul><li>데이터베이스, 스키마, 테이블 및 뷰 메타데이터를 사용하여 데이터 모델을 이해합니다</li><li>분석 계층이 어떻게 구성되었는지 확인하려면 뷰 정의를 검토합니다</li><li>데이터셋 및 SQL 콘솔 편집기를 사용하여 데이터셋을 구성하고 읽기 중심 질의를 다듬습니다</li></ul>
app.assistant.hint.DatabaseAssistantMode_DEVELOPMENT=<strong>개발</strong><br>데이터베이스 및 코드 중심 작업을 위한 모드입니다.<ul><li>데이터베이스, 스키마, 테이블, 뷰 및 프로그램 메타데이터를 사용하여 구조를 탐색합니다</li><li>기존 로직을 이해하려면 뷰 및 프로그램 소스 코드를 검사합니다</li><li>데이터셋, 소스 코드 및 SQL 콘솔 편집기에서 코드를 작성하고 다듬습니다</li></ul>
app.assistant.hint.DatabaseAssistantMode_RAG=<strong>RAG(Retrieval-Augmented Generation)</strong><br>시맨틱 검색 기반 답변을 위한 모드입니다.<ul><li>색인된 콘텐츠에 대해 자연어 질문을 합니다</li><li>시맨틱 검색을 사용하여 관련 정보를 검색하고 요약합니다</li><li>검색된 자료에 근거한 간결한 답변을 받습니다</li></ul>
app.assistant.hint.PromptAction_CHAT=프롬프트를 기반으로 LLM에서 직접 응답을 생성합니다(프로파일 대화가 사용 설정되지 않은 경우 데이터 모델을 알지 못할 수 있음)
app.assistant.hint.PromptAction_EXECUTE_SQL=선택한 프로파일에 노출된 데이터 모델을 기반으로 자연어 프롬프트에서 SQL 문장을 생성하고 실행합니다
