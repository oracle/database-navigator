msg.mcp.text.BuildResultHttp=<html><b>MCP 서버가 성공적으로 빌드되었습니다.</b><br><br>빌드된 JAR: {0}<br>구성: {1}<br>Wallet: {2}<br>소스 프로젝트: {3}<br><br><b>다음 단계:</b><br>1. HTTP를 제공하도록 JAR을 시작하세요(transport/httpPort는 README 참조).<br>2. 아래 JSON을 MCP 클라이언트 구성에 복사하세요.<br>3. <code>wallet/</code> 폴더를 비공개로 안전하게 보관하세요.<br>4. 전체 실행 세부 정보와 HTTP 사용자화(<code>httpPort</code> 변경 포함)는 출력 폴더의 <code>README.md</code>를 참조하세요.</html>
msg.mcp.text.BuildResultStdio=<html><b>MCP 서버가 성공적으로 빌드되었습니다.</b><br><br>빌드된 JAR: {0}<br>구성: {1}<br>Wallet: {2}<br>소스 프로젝트: {3}<br><br><b>다음 단계:</b><br>1. 아래 JSON을 MCP 클라이언트 구성(예: Claude Desktop)에 복사하세요.<br>2. <code>wallet/</code> 폴더를 비공개로 보관하세요.<br>3. 전체 실행 및 사용자화 세부 정보는 출력 폴더의 <code>README.md</code>를 참조하세요.</html>
msg.mcp.text.NamedParametersQuickGuide=<html><b>SQL에서 <code>:param</code> 자리 표시자를 사용하세요.</b><ul style="margin-top:4; margin-bottom:4;"><li><code>:param</code>을 작성하세요(예: <code>WHERE dept_id = :dept</code>).</li><li>이름을 감지하여 매개변수 테이블에 나열합니다.</li><li>빌드 시 왼쪽에서 오른쪽 순서로 JDBC <code>?</code>가 됩니다.</li><li>반복된 이름은 각 위치에 <i>동일한</i> 값을 바인드합니다.</li></ul></html>
