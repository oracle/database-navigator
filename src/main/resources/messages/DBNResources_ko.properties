msg.mcp.hint.ServerDefinition=MCP 서버 빌더를 사용하면 이 데이터베이스 연결을 위한 SQL 기반 MCP 도구를 정의할 수 있습니다.\n\n각 도구는 유형이 지정된 매개변수가 있는 이름 있는 SQL 문장을 MCP 클라이언트에 노출합니다. STDIO 또는 HTTP 전송을 선택하고 실행 가능한 JAR, 구성, Wallet, 소스 프로젝트 및 README가 포함된 독립 실행형 서버 패키지를 빌드하세요.
msg.mcp.hint.ToolDefinition=MCP 도구 빌더는 SQL 문장을 이 MCP 서버에서 호출 가능한 도구로 변환합니다.\n\nMCP 클라이언트가 올바르게 선택할 수 있도록 도구 이름과 설명을 지정하세요. :employee_id 같은 이름 있는 SQL 매개변수를 사용하세요. 매개변수 목록은 문장에서 파생되며 유형, 필수 플래그, 설명 및 테스트 값을 정의할 수 있습니다. 저장하기 전에 확인을 실행하여 샘플 값으로 질의를 실행하세요.
