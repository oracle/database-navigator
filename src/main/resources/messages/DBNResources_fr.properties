app.assistant.hint.DatabaseAssistantMode_ANALYTICS=<strong>Analyse</strong><br>Pour l’exploration et l’interrogation des données.<ul><li>Utilisez les métadonnées de base de données, de schéma, de table et de vue pour comprendre votre modèle de données</li><li>Examinez les définitions des vues pour voir comment les couches analytiques sont construites</li><li>Modelez les jeux de données et affinez les requêtes orientées lecture à l’aide des éditeurs de jeux de données et de consoles SQL</li></ul>
app.assistant.hint.DatabaseAssistantMode_DEVELOPMENT=<strong>Développement</strong><br>Pour les travaux centrés sur la base de données et le code.<ul><li>Utilisez les métadonnées de base de données, de schéma, de table, de vue et de programme pour explorer les structures</li><li>Inspectez le code source des vues et des programmes pour comprendre la logique existante</li><li>Travaillez dans les éditeurs de jeux de données, de code source et de consoles SQL pour rédiger et affiner le code</li></ul>
app.assistant.hint.DatabaseAssistantMode_RAG=<strong>RAG (Retrieval-Augmented Generation)</strong><br>Pour des réponses basées sur la recherche sémantique.<ul><li>Posez des questions en langage naturel sur votre contenu indexé</li><li>Récupérez et résumez les informations pertinentes à l’aide de la recherche sémantique</li><li>Recevez des réponses concises fondées sur les éléments récupérés</li></ul>
