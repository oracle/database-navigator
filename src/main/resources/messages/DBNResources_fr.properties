msg.mcp.question.GraalVmNotFound=Les builds natifs du serveur MCP nécessitent que Maven s'exécute sur un JDK GraalVM incluant l'outil native-image.
Le JRE du runner Maven actuellement configuré ne remplit pas cette condition.

Configurez un JDK GraalVM sous Maven | Runner | JRE, ou utilisez plutôt l'option de build Image de conteneur, qui ne nécessite aucun GraalVM local.

Ouvrir les paramètres Maven maintenant ?
