msg.mcp.hint.ServerDefinition=Le générateur de serveur MCP vous aide à définir des outils MCP basés sur SQL pour cette connexion de base de données.\n\nChaque outil expose aux clients MCP une instruction SQL nommée avec des paramètres typés. Choisissez le transport STDIO ou HTTP et construisez un package serveur autonome avec un JAR exécutable, une configuration, un Wallet, un projet source et un README.
msg.mcp.hint.ToolDefinition=Le générateur d’outils MCP transforme une instruction SQL en outil appelable pour ce serveur MCP.\n\nNommez et décrivez l’outil afin que les clients MCP puissent le choisir correctement. Utilisez des paramètres SQL nommés comme :employee_id ; la liste des paramètres est dérivée de l’instruction et vous permet de définir les types, indicateurs obligatoires, descriptions et valeurs de test. Exécutez Vérifier pour lancer la requête avec des exemples de valeurs avant l’enregistrement.
