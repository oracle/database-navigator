cfg.assistant.hint.ApiKeyRequiredToConnect=Pour vous connecter aux modèles de langage {0}, saisissez votre clé API personnelle ci-dessous. Vous pouvez créer et gérer vos clés sur la page officielle des clés API {0}.\n\nVotre clé sera stockée de façon sécurisée dans le gestionnaire de mots de passe de {1}.
cfg.assistant.hint.OciConfigRequiredToConnect=Pour vous connecter aux modèles de langage Oracle OCI Generative AI, renseignez ci-dessous les informations de configuration OCI. Dans Oracle Cloud Console, ouvrez la section "Identity" pour trouver vos OCID utilisateur, tenancy et compartiment, ainsi que les instructions pour télécharger votre fichier de clé privée ou le fichier de configuration OCI.
cfg.assistant.hint.ProfileDatasetSelection=Les profils IA doivent inclure des informations sur votre modèle de données afin de les transmettre au modèle de langage. Cela lui permet de produire des résultats plus précis et mieux adaptés à votre modèle de données. Les métadonnées peuvent inclure les noms des tables, les noms des colonnes, les types de données des colonnes et les commentaires. Vos données ne sont jamais envoyées au modèle de langage.\n\nSélectionnez les jeux de données à inclure dans le profil, puis faites-les glisser dans le conteneur à droite. Commencez par sélectionner le schéma.
cfg.assistant.hint.ProfileEdit=Les profils vous permettent de personnaliser votre expérience avec le LLM. Vous pouvez choisir différents préréglages de température pour ajuster l’équilibre entre précision et créativité. Vous pouvez aussi définir des instructions personnalisées pour aider le LLM à mieux comprendre vos besoins.
