app.assistant.hint.AssistantTemperaturePreset_BALANCED=Offre un équilibre entre précision et créativité. Adapté à la plupart des tâches, avec un mélange de fiabilité et d’innovation.
app.assistant.hint.AssistantTemperaturePreset_CUSTOM=Ajustez manuellement la température pour affiner la génération des réponses. Permet de contrôler précisément l’équilibre entre précision et créativité.
app.assistant.hint.AssistantTemperaturePreset_EXPERIMENTAL=Génère des réponses très innovantes et potentiellement non conventionnelles. Idéal pour les tâches qui repoussent les limites du langage et de la créativité.
app.assistant.hint.AssistantTemperaturePreset_EXPLORATORY=Encourage des réponses plus créatives et plus variées. Utile pour les tâches qui bénéficient de l’exploration de différentes idées et perspectives.
app.assistant.hint.AssistantTemperaturePreset_PRECISE=Génère des réponses très précises avec peu de créativité. Idéal pour les tâches qui exigent des informations exactes et factuelles.
