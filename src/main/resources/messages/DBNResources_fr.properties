msg.mcp.text.BuildResultContainer=<html><b>Image Docker {0} créée avec succès.</b><br><br>Configuration : {1}<br>Wallet : {2}<br>Projet source : {3}<br><br>L''image cible <b>{4}</b>. Consultez <code>README.md</code> dans le dossier de sortie pour savoir comment exécuter l''image et la compiler pour d''autres architectures.<br><br>Une fois le conteneur en cours d''exécution, copiez le JSON ci-dessous dans la configuration de votre client MCP. Gardez le dossier <code>wallet/</code> privé — il est monté à l''exécution, jamais intégré à l''image.</html>
msg.mcp.text.BuildResultHttp=<html><b>Serveur MCP construit avec succès.</b><br><br>JAR construit : {0}<br>Configuration : {1}<br>Wallet : {2}<br>Projet source : {3}<br><br><b>Étapes suivantes :</b><br>1. Démarrez le JAR pour qu’il serve HTTP (voir README pour transport/httpPort).<br>2. Copiez le JSON ci-dessous dans la configuration de votre client MCP.<br>3. Gardez le dossier <code>wallet/</code> privé et sécurisé.<br>4. Consultez <code>README.md</code> dans le dossier de sortie pour les détails complets d’exécution et la personnalisation HTTP (y compris les changements de <code>httpPort</code>).</html>
msg.mcp.text.BuildResultNativeHttp=<html><b>Serveur MCP natif compilé avec succès.</b><br><br>Exécutable : {0}<br>Configuration : {1}<br>Wallet : {2}<br>Projet source : {3}<br><br><b>Étapes suivantes :</b><br>1. Démarrez l'exécutable pour servir HTTP (voir le README concernant transport/httpPort).<br>2. Copiez le JSON ci-dessous dans la configuration de votre client MCP.<br>3. Gardez le dossier <code>wallet/</code> privé et sécurisé.<br>4. L'exécutable ne fonctionne que sur ce système d'exploitation et cette architecture de processeur.<br>5. Consultez <code>README.md</code> dans le dossier de sortie pour tous les détails.</html>
msg.mcp.text.BuildResultNativeStdio=<html><b>Serveur MCP natif compilé avec succès.</b><br><br>Exécutable : {0}<br>Configuration : {1}<br>Wallet : {2}<br>Projet source : {3}<br><br><b>Étapes suivantes :</b><br>1. Copiez le JSON ci-dessous dans la configuration de votre client MCP (par ex. Claude Desktop) — l'exécutable se lance directement, sans Java.<br>2. Gardez le dossier <code>wallet/</code> privé.<br>3. L'exécutable ne fonctionne que sur ce système d'exploitation et cette architecture de processeur.<br>4. Consultez <code>README.md</code> dans le dossier de sortie pour tous les détails.</html>
msg.mcp.text.BuildResultStdio=<html><b>Serveur MCP construit avec succès.</b><br><br>JAR construit : {0}<br>Configuration : {1}<br>Wallet : {2}<br>Projet source : {3}<br><br><b>Étapes suivantes :</b><br>1. Copiez le JSON ci-dessous dans la configuration de votre client MCP (par ex. Claude Desktop).<br>2. Gardez le dossier <code>wallet/</code> privé.<br>3. Consultez <code>README.md</code> dans le dossier de sortie pour les détails complets d’exécution et de personnalisation.</html>
msg.mcp.text.ContainerBuilderPlatform=la plateforme de compilation
msg.mcp.text.GraalApplicationCreated=L'application Graal "{0}" a été demandée à partir de l'image {1}.\n\nL'application démarre à l'état CREATING ; son point de terminaison sera disponible lorsqu'elle atteindra ACTIVE. Pensez à accorder à l'utilisateur de base de données GRAAL_ généré l'accès aux tables interrogées par vos outils. Le chemin du point de terminaison MCP est /mcp.
msg.mcp.text.GraalApplicationActive=L''application Graal « {0} » est active.\n\nPoint de terminaison :\n{1}\n\nLe chemin du point de terminaison MCP est /mcp. Si une requête d''outil échoue avec ORA-00942, accordez à l''utilisateur de base de données GRAAL_ généré l''accès aux tables qu''elle interroge.
msg.mcp.text.GraalApplicationPending=L''application Graal « {0} » a été créée et est toujours en cours de provisionnement (état : {1}).\n\nSon point de terminaison devient disponible une fois qu''elle atteint l''état ACTIVE.
msg.mcp.text.GraalDeploymentPrerequisites=Nécessite l'authentification externe OCI IAM activée sur la base de données, une politique DB_CONNECT pour les principaux graalapplication, un référentiel OCIR existant et un docker login effectué. L'image est créée pour linux/amd64.
msg.mcp.text.GraalImagePushed=L'image {0} a été poussée avec succès.\n\nOuvrez la console OCI (Developer Services > Containers & Artifacts > Container Registry), sélectionnez la version d'image poussée, copiez son OCID d'image et collez-le ci-dessous pour créer l'application Graal.
msg.mcp.text.GraalImagePushedOcidUnresolved=L'image {0} a été poussée avec succès, mais son OCID n'a pas pu être résolu automatiquement.\n\nOuvrez la console OCI (Developer Services > Containers & Artifacts > Container Registry), copiez l'OCID d'image et collez-le ci-dessous.
msg.mcp.text.GraalImagePushedWithOcid=L'image {0} a été poussée avec succès.\n\nOCID d'image résolu :\n{1}\n\nIl a été renseigné ci-dessous - vous pouvez maintenant créer l'application Graal.
msg.mcp.text.NativePrerequisites=La création de l'exécutable natif nécessite un JDK GraalVM (avec native-image) configuré comme JRE du runner Maven. Sans GraalVM, utilisez plutôt l'option Image de conteneur, qui compile dans un conteneur.
msg.mcp.text.ContainerPrerequisites=Un environnement de conteneurs compatible Docker en cours d'exécution (Docker ou Podman) est requis. Aucun GraalVM local n'est requis. L'image cible la plateforme de compilation; utilisez source-project/Dockerfile sur une machine ou un runner CI de l'architecture cible pour une autre plateforme.
msg.mcp.text.NamedParametersQuickGuide=<html><b>Utilisez des paramètres <code>:param</code> dans votre SQL.</b><ul style="margin-top:4; margin-bottom:4;"><li>Écrivez <code>:param</code> (par ex. <code>WHERE dept_id = :dept</code>).</li><li>Nous détectons les noms et les listons dans la table des paramètres.</li><li>À la construction, ils deviennent des <code>?</code> JDBC de gauche à droite.</li><li>Les noms répétés lient la <i>même</i> valeur à chaque occurrence.</li></ul></html>
